name: Test, build, and release

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  test-and-build:
    name: macOS · ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify toolchain and architecture
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: |
          test "$(uname -m)" = "$EXPECTED_ARCH"
          swift --version
          python3 --version

      - name: Validate release metadata
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          python3 Tests/VersionTests.py
          if [ "$REF_TYPE" = "tag" ]; then
            python3 scripts/version.py --tag "$REF_NAME"
          else
            python3 scripts/version.py
          fi

      - name: Run fixture and state tests
        run: ./test.sh

      - name: Build and verify app signature
        run: ./build.sh

      - name: Package app
        env:
          BUILD_ARCH: ${{ matrix.arch }}
        run: |
          mkdir -p "$RUNNER_TEMP/artifacts"
          test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' ../AgentsPanel.app/Contents/Info.plist)" = "$(python3 scripts/version.py)"
          test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleVersion' ../AgentsPanel.app/Contents/Info.plist)" = "$(python3 scripts/version.py --field build)"
          lipo ../AgentsPanel.app/Contents/MacOS/AgentsPanel -verify_arch "$BUILD_ARCH"
          ditto -c -k --sequesterRsrc --keepParent ../AgentsPanel.app "$RUNNER_TEMP/artifacts/AgentsPanel-macos-$BUILD_ARCH.zip"

      - name: Upload app archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: AgentsPanel-macos-${{ matrix.arch }}
          path: ${{ runner.temp }}/artifacts/AgentsPanel-macos-${{ matrix.arch }}.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  release:
    name: Publish release
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: test-and-build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ github.ref_name }}
      RUN_ID: ${{ github.run_id }}
    steps:
      - name: Download tested builds
        run: |
          gh run download "$RUN_ID" --name AgentsPanel-macos-arm64 --dir assets
          gh run download "$RUN_ID" --name AgentsPanel-macos-x86_64 --dir assets
          test -s assets/AgentsPanel-macos-arm64.zip
          test -s assets/AgentsPanel-macos-x86_64.zip
          cd assets
          sha256sum AgentsPanel-macos-*.zip > SHA256SUMS.txt

      - name: Create release with both apps
        run: |
          gh release create "$RELEASE_TAG" \
            assets/AgentsPanel-macos-arm64.zip \
            assets/AgentsPanel-macos-x86_64.zip \
            assets/SHA256SUMS.txt \
            --verify-tag --draft --title "$RELEASE_TAG" --generate-notes
          gh release edit "$RELEASE_TAG" --draft=false
